// ---- CONFIG ---------------------------------------------------------------
// Each form tab is its own data source (File > Share > Publish to web > pick the tab > CSV).

// filters: dropdowns for this tab, using only columns that exist in that tab's CSV.
// display (optional): shortens long option labels; matching still uses the full value.
// extras: columns shown in the table and in the detail view.
// Year/Quarter/Month filters and the monthly chart appear automatically once the tab has a Created column.

  {
    type: "New Template / Template Change Request",
    intake: "https://hellofresh.atlassian.net/servicedesk/customer/portal/2984/create/12951",

      { field: "Country", label: "Country" },

  {

      { field: "Permission", label: "Permission" },

    ],

];

// ---- CONSTANTS ------------------------------------------------------------
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const STATUS_COLORS = { "open": "#91c13e", "in progress": "#3b82f6", "on hold": "#f59e0b", "resolved": "#059669", "closed": "#94a3b8" };
const ICON = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  alert: '<path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/>',
};

// ---- STATE & HELPERS ------------------------------------------------------
const data = {};
let current = FORMS[0].type;
let filterState = {};     // dropdown field -> selected value; year/quarter/month use the same map
let visible = [];
let lastLoaded = null;
let loadError = "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const val = (r, k) => (r[k] || "").trim();
const norm = s => (s || "").replace(/\s+/g, " ").trim();
const currentForm = () => FORMS.find(f => f.type === current);
const rowsFor = () => data[current] || [];

// "Work" holds "OPEXIRCL-40 Summary text" in every tab.
const keyOf = r => val(r, "Work").split(" ")[0];
const summaryOf = r => val(r, "Work").slice(keyOf(r).length).trim();
const keyNum = r => parseInt(keyOf(r).split("-").pop(), 10) || 0;
const isOpen = r => !["resolved", "closed"].includes(val(r, "Status").toLowerCase());

const toDate = s => {
  if (!s) return null;
  const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + "T00:00:00") : new Date(s);
  return isNaN(d) ? null : d;
};
const created = r => toDate(val(r, "Created"));
const resolvedOn = r => toDate(val(r, "Resolved Date"));
const hasCreated = () => rowsFor().some(r => created(r));
const fmtDate = s => { const d = toDate(s); return d ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "—"; };
const monthKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const monthLabel = k => MONTHS[+k.slice(5) - 1].slice(0, 3) + " " + k.slice(2, 4);

function statusPill(s) {
  const v = s.toLowerCase();
  const cls = (v === "resolved" || v === "closed") ? "bg-lime-100 text-lime-800"
            : v === "on hold" ? "bg-slate-200 text-slate-700"
            : "bg-amber-100 text-amber-800";
  return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${cls}">${esc(s || "—")}</span>`;
}

// ---- DATA -----------------------------------------------------------------
function fetchTab(form) {
  return new Promise((resolve, reject) => {
    Papa.parse(form.csvUrl, {
      download: true,
      header: false,            // the sheet tabs have title rows above the header, so read raw rows first
      skipEmptyLines: true,
      complete: res => {
        const rows = res.data;
        const h = rows.findIndex(r => (r[0] || "").trim() === "Work");
        if (h < 0) return reject(new Error("no 'Work' header row found"));
        const headers = rows[h].map(x => (x || "").trim());
        resolve(rows.slice(h + 1)
          .map(cells => Object.fromEntries(headers.map((k, i) => [k, (cells[i] ?? "").trim()])))
          .filter(r => val(r, "Work")));
      },
      error: err => reject(err),
    });
  });
}

async function load() {
  const results = await Promise.allSettled(FORMS.map(fetchTab));
  loadError = "";
  results.forEach((res, i) => {
    data[FORMS[i].type] = res.status === "fulfilled" ? res.value : [];
    if (res.status === "rejected") {
      loadError += (loadError ? " · " : "") + FORMS[i].label + ": " + ((res.reason && res.reason.message) || "failed to load");
    }
  });
  lastLoaded = new Date();
  renderSync();
  renderFilters();
  render();
}

// ---- SYNC BAR -------------------------------------------------------------
function renderSync() {
  if (!lastLoaded) return;
  const fmt = tz => lastLoaded.toLocaleString("en-US", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
  $("tz").innerHTML = [["Berlin", "Europe/Berlin"], ["ANZ", "Australia/Sydney"], ["US", "America/New_York"], ["Manila", "Asia/Manila"]]
    .map(([label, tz]) => `<span>${label}: <span class="text-white">${fmt(tz)}</span></span>`)
    .join('<span class="text-[#91c13e]">|</span>');

  const elapsed = Date.now() - lastLoaded.getTime();
  const ago = Math.floor(elapsed / 60000);
  const next = Math.max(0, Math.ceil((REFRESH_MS - elapsed) / 60000));
  $("ago").innerHTML = (loadError ? `<span class="text-rose-400">${esc(loadError)}</span> <span class="text-slate-600">·</span> ` : "") + `Synced ${Math.floor(ago / 60)}h ${ago % 60}m ago <span class="text-slate-600">·</span> next in <strong class="text-[#91c13e]">${Math.floor(next / 60)}h ${next % 60}m</strong>`;
}

// ---- FILTERS --------------------------------------------------------------
function dd(field, label, options, show = v => v) {
  const selected = String(filterState[field] || "");
  return `<select data-field="${esc(field)}" class="${SELECT}">
    <option value="">All ${esc(label)}</option>
    ${options.map(v => `<option value="${esc(v)}" ${String(v) === selected ? "selected" : ""}>${esc(show(v))}</option>`).join("")}
  </select>`;
}

function renderFilters() {
  const form = currentForm();
  const base = rowsFor();
  let html = "";
  if (hasCreated()) {
    const years = [...new Set(base.map(r => created(r)?.getFullYear()).filter(Boolean))].sort();
    html += dd("year", "Years", years);
    html += dd("quarter", "Quarters", ["Q1", "Q2", "Q3", "Q4"]);
    html += dd("month", "Months", MONTHS);
  }
  html += form.filters.map(f => {
    const values = [...new Set(base.map(r => norm(val(r, f.field))).filter(Boolean))].sort();
    return dd(f.field, f.label, values, f.display);
  }).join("");
  $("dyn").innerHTML = html;
}

function applyFilters() {
  const form = currentForm();
  const q = $("search").value.trim().toLowerCase();
  const base = rowsFor();

  let list = base;
  for (const f of form.filters) {
    const s = filterState[f.field];
    if (s) list = list.filter(r => norm(val(r, f.field)) === s);
  }
  if (filterState.year) list = list.filter(r => created(r)?.getFullYear() === +filterState.year);
  if (filterState.quarter) list = list.filter(r => { const d = created(r); return d && ("Q" + (Math.floor(d.getMonth() / 3) + 1)) === filterState.quarter; });
  if (filterState.month) list = list.filter(r => { const d = created(r); return d && MONTHS[d.getMonth()] === filterState.month; });
  if (q) list = list.filter(r => Object.values(r).join(" ").toLowerCase().includes(q));

  const sort = $("sort").value;
  list = [...list].sort((a, b) => {
    if (sort === "key_asc") return keyNum(a) - keyNum(b);
    if (sort === "status") return (isOpen(b) - isOpen(a)) || (keyNum(b) - keyNum(a));
    return keyNum(b) - keyNum(a);
  });

  return { form, base, list };
}

// ---- TABS -----------------------------------------------------------------
function renderTabs() {
  $("tabs").innerHTML = FORMS.map(f => {
    const n = (data[f.type] || []).length;
    const on = f.type === current;
    return `<button data-type="${esc(f.type)}" class="flex items-center gap-2 px-3 py-2 rounded-lg font-bold uppercase text-[11px] tracking-wider text-left leading-tight transition-all duration-200 shrink-0 ${
      on ? "bg-[#91c13e] text-[#062115] shadow-md font-extrabold" : "text-gray-300 hover:text-white hover:bg-white/5"}">
      <span>${esc(f.label)}</span><span class="opacity-70">${n}</span></button>`;
  }).join("");
}

// ---- KPIs -----------------------------------------------------------------
function kpi(label, value, sub, icon, iconColor) {
  return `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col justify-between h-32 transition-all hover:scale-[1.01] hover:shadow-md">
      <div class="flex items-center justify-between">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">${label}</span>
        <div class="p-1.5 rounded-lg bg-slate-50 ${iconColor}">
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
        </div>
      </div>
      <div>
        <h3 class="text-xl font-black tracking-tight text-[#062115]">${value}</h3>
        <p class="text-[10px] text-slate-400 font-semibold mt-0.5 truncate">${sub}</p>
      </div>
    </div>`;
}

function renderKpis(list) {
  const total = list.length;
  const open = list.filter(isOpen).length;
  const resolved = list.filter(r => ["resolved", "closed"].includes(val(r, "Status").toLowerCase())).length;
  const onHold = list.filter(r => val(r, "Status").toLowerCase() === "on hold").length;
  const pct = total ? Math.round(resolved / total * 100) : 0;
  $("kpis").innerHTML =
    kpi("Current Pipeline", open, "Open, in progress or on hold", ICON.clock, "text-teal-600") +
    kpi("Resolution Rate", pct + "%", `${resolved} of ${total} resolved or closed`, ICON.check, "text-emerald-600") +
    kpi("On Hold", onHold, "Waiting on input", ICON.alert, "text-amber-500");
}

// ---- MOMENTUM (monthly submitted vs completed) ----------------------------
function renderMomentum(list) {
  const el = $("momentum");
  const sub = {}, comp = {};
  list.forEach(r => {
    const c = created(r); if (c) sub[monthKey(c)] = (sub[monthKey(c)] || 0) + 1;
    const d = resolvedOn(r); if (d) comp[monthKey(d)] = (comp[monthKey(d)] || 0) + 1;
  });
  const keys = [...new Set([...Object.keys(sub), ...Object.keys(comp)])].sort();
  if (!keys.length) {
    el.innerHTML = `<p class="text-slate-400 text-xs font-bold uppercase tracking-wider text-center">${
      hasCreated() ? "No dated requests in this view" : "Add Created and Resolved Date columns to this tab to see monthly flow"}</p>`;
    return;
  }
  const [y0, m0] = keys[0].split("-").map(Number);
  const [y1, m1] = keys[keys.length - 1].split("-").map(Number);
  const months = [];
  for (let y = y0, m = m0; y < y1 || (y === y1 && m <= m1);) {
    months.push(y + "-" + String(m).padStart(2, "0"));
    if (++m > 12) { m = 1; y++; }
  }
  drawMomentum(months, months.map(k => sub[k] || 0), months.map(k => comp[k] || 0));
}

function drawMomentum(months, sub, comp) {
  const el = $("momentum");
  el.innerHTML = "";
  const W = el.clientWidth || 640, H = 280, M = { t: 16, r: 20, b: 34, l: 40 };
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", "100%").attr("height", H);
  const x = d3.scalePoint().domain(months).range([M.l, W - M.r]).padding(0.5);
  const y = d3.scaleLinear().domain([0, Math.max(1, d3.max([...sub, ...comp]))]).nice().range([H - M.b, M.t]);

  svg.append("g").attr("transform", `translate(0,${H - M.b})`)
    .call(d3.axisBottom(x).tickFormat(monthLabel))
    .call(g => g.select(".domain").remove())
    .selectAll("text").attr("font-size", 11).attr("fill", "#64748b");

  svg.append("g").attr("transform", `translate(${M.l},0)`)
    .call(d3.axisLeft(y).ticks(5).tickSize(-(W - M.l - M.r)))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line").attr("stroke", "#e2e8f0"))
    .selectAll("text").attr("font-size", 11).attr("fill", "#64748b");

  const line = d3.line().x((d, i) => x(months[i])).y(d => y(d)).curve(d3.curveMonotoneX);
  svg.append("path").attr("d", line(sub)).attr("fill", "none").attr("stroke", "#cbd5e1").attr("stroke-width", 2.5);
  svg.append("path").attr("d", line(comp)).attr("fill", "none").attr("stroke", "#91c13e").attr("stroke-width", 2.5);
  [[sub, "#cbd5e1"], [comp, "#91c13e"]].forEach(([vals, c]) =>
    svg.selectAll(null).data(vals).enter().append("circle")
      .attr("cx", (d, i) => x(months[i])).attr("cy", d => y(d))
      .attr("r", 4).attr("fill", "#fff").attr("stroke", c).attr("stroke-width", 2));
}

// ---- STATUS DONUT ---------------------------------------------------------
function arcPath(cx, cy, r, ir, a0, a1) {
  const p = (a, rr) => [cx + rr * Math.sin(a), cy - rr * Math.cos(a)];
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = p(a0, r), [x1, y1] = p(a1, r), [x2, y2] = p(a1, ir), [x3, y3] = p(a0, ir);
  return `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${ir},${ir} 0 ${large} 0 ${x3},${y3} Z`;
}

function renderDonut(list) {
  const el = $("donut");
  const total = list.length;
  if (!total) {
    el.innerHTML = `<div class="flex-1 flex items-center justify-center text-slate-400 font-bold uppercase tracking-wider text-xs py-12">No data for this view</div>`;
    return;
  }
  const counts = {}, labels = {};
  list.forEach(r => {
    const s = val(r, "Status") || "Unknown";
    const k = s.toLowerCase();
    counts[k] = (counts[k] || 0) + 1;
    labels[k] = labels[k] || s;
  });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const cx = 90, cy = 90, r = 75, ir = 48;
  let a = 0;
  const slices = entries.map(([k, c]) => {
    const color = STATUS_COLORS[k] || "#6366f1";
    if (entries.length === 1) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
    const a0 = a, a1 = a + c / total * 2 * Math.PI;
    a = a1;
    return `<path d="${arcPath(cx, cy, r, ir, a0, a1)}" fill="${color}" stroke="#fff" stroke-width="2"/>`;
  }).join("");

  const max = entries[0][1];
  const legend = entries.map(([k, c]) => {
    const color = STATUS_COLORS[k] || "#6366f1";
    return `
      <div class="flex items-center gap-3 text-xs">
        <span class="flex items-center gap-2 w-36 font-black uppercase tracking-wide text-slate-700">
          <span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span>${esc(labels[k])}</span>
        <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full rounded-full" style="width:${c / max * 100}%;background:${color}"></div></div>
        <span class="w-8 text-right font-black text-slate-700">${c}</span>
      </div>`;
  }).join("");

  el.innerHTML = `
    <div class="flex justify-center my-4">
      <svg viewBox="0 0 180 180" class="w-56 h-56">
        ${slices}
        <circle cx="${cx}" cy="${cy}" r="${ir}" fill="#fff"/>
        <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="26" font-weight="900" fill="#062115">${total}</text>
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="8" fill="#94a3b8" letter-spacing="2">TOTAL</text>
      </svg>
    </div>
    <div class="space-y-3">${legend}</div>`;
}

// ---- TABLE ----------------------------------------------------------------
function renderTable(list, form) {
  const heads = ["Key", "Summary", "Status", "Reporter", ...form.extras.map(k => k.replace(":", ""))];
  $("thead").innerHTML = `<tr>${heads.map(h =>
    `<th class="text-left px-4 py-3 text-[10px] font-black uppercase tracking-wider text-slate-400">${esc(h)}</th>`).join("")}</tr>`;
  $("tbody").innerHTML = list.length ? list.map((r, i) => `
    <tr data-i="${i}" class="cursor-pointer hover:bg-slate-50 border-t border-slate-100">
      <td class="px-4 py-3 font-mono text-xs text-slate-500 whitespace-nowrap">${esc(keyOf(r))}</td>
      <td class="px-4 py-3 font-semibold text-[#062115]">${esc(summaryOf(r))}</td>
      <td class="px-4 py-3">${statusPill(val(r, "Status"))}</td>
      <td class="px-4 py-3 text-xs text-slate-600">${esc(val(r, "Reporter"))}</td>
      ${form.extras.map(k => `<td class="px-4 py-3 text-xs text-slate-600">${esc(norm(val(r, k)))}</td>`).join("")}
    </tr>`).join("")
    : `<tr><td colspan="${heads.length}" class="px-4 py-8 text-center text-slate-400">No requests match these filters.</td></tr>`;
}

// ---- MODAL ----------------------------------------------------------------
function openModal(r) {
  const form = currentForm();
  const items = [
    ["Reporter", val(r, "Reporter")],
    ["Assignee", val(r, "Assignee")],
    ["Status", val(r, "Status")],
    ["Created", fmtDate(val(r, "Created"))],
    ...form.extras.map(k => [k.replace(":", ""), norm(val(r, k))]),
  ].filter(([, v]) => v && v !== "—");

  $("modal-body").innerHTML = `
    <p class="text-xs font-mono text-slate-500">${esc(keyOf(r))}</p>
    <h2 class="text-xl font-black text-[#062115] mt-1 pr-6">${esc(summaryOf(r) || keyOf(r))}</h2>
    <dl class="grid grid-cols-2 gap-3 text-sm mt-5">
      ${items.map(([k, v]) => `<div><dt class="text-[10px] uppercase font-bold tracking-wider text-slate-400">${esc(k)}</dt><dd class="text-slate-700">${esc(v)}</dd></div>`).join("")}
    </dl>
    ${val(r, "Description") ? `
      <div class="mt-5">
        <h3 class="text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Description</h3>
        <p class="whitespace-pre-wrap text-sm text-slate-700 bg-slate-50 rounded-lg p-3 max-h-72 overflow-y-auto">${esc(val(r, "Description"))}</p>
      </div>` : ""}
    <a href="${JIRA_BROWSE}${encodeURIComponent(keyOf(r))}" target="_blank" rel="noopener"
       class="inline-block mt-5 text-sm font-bold text-[#062115] underline">Open in Jira ↗</a>`;

  $("modal").classList.remove("hidden");
  $("modal").classList.add("flex");
}

function closeModal() {
  $("modal").classList.add("hidden");
  $("modal").classList.remove("flex");
}

// ---- RENDER ---------------------------------------------------------------
function render() {
  renderTabs();
  $("intake").href = currentForm().intake;
  $("subtitle").textContent = "Ironclad Portfolio · " + currentForm().title;
  const { form, base, list } = applyFilters();
  renderKpis(list);
  renderMomentum(list);
  renderDonut(list);
  renderTable(list, form);
  $("count").textContent = `${list.length} of ${base.length} requests`;
  visible = list;
}

// ---- EVENTS ---------------------------------------------------------------
$("search").addEventListener("input", render);
$("sort").addEventListener("change", render);

$("dyn").addEventListener("change", e => {
  const field = e.target.dataset.field;
  if (field) { filterState[field] = e.target.value; render(); }
});

$("clear").addEventListener("click", () => {
  filterState = {};
  $("search").value = "";
  renderFilters();
  render();
});

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  current = b.dataset.type;
  filterState = {};
  $("search").value = "";
  renderFilters();
  render();
});

$("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-i]");
  if (tr) openModal(visible[+tr.dataset.i]);
});

$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

renderFilters();
render();
load();
setInterval(load, REFRESH_MS);
setInterval(renderSync, 30 * 1000);
</script>
</body>
</html>
